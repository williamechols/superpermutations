# Superpermutation Almanac batch: a lower bound for n = 9, with one search evaluated by native_decide.
name = "almanac_submission"
defaultTargets = ["AlmanacSolution"]

# The four reserved Almanac libraries.
[[lean_lib]]
name = "AlmanacDefs"

[[lean_lib]]
name = "AlmanacStatement"

[[lean_lib]]
name = "AlmanacChallenge"

[[lean_lib]]
name = "AlmanacSolution"

# Vendored libraries (see NOTICE).
[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Hunter"
globs = ["Hunter.+"]

[[lean_lib]]
name = "PreimageChain"
globs = ["PreimageChain.+"]

[[lean_lib]]
name = "Superperm"
globs = ["Superperm.+"]

[[lean_lib]]
name = "LowerBounds"
globs = ["LowerBounds.+"]

# The proof of S(9) >= 408,470.
[[lean_lib]]
name = "W9"
globs = ["W9.+"]

# Halfar's window search (LowerBounds.SSearch) and its compiled copy (W9.SearchC) as a library of their own,
# compiled to native code: Lake loads it when it builds the module that evaluates the search (W9.Native), so
# the native_decide evaluation runs compiled code. It is declared after LowerBounds and W9, so this library
# owns the two modules.
[[lean_lib]]
name = "WSearchEngine"
roots = ["LowerBounds.SSearch", "W9.SearchC"]
precompileModules = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"
